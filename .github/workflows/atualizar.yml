name: Atualizar cotas e publicar site

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "47 22 * * *"
  push:
    branches: [main]
    paths:
      - "fundos.yaml"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dados da CVM e do Banco Central
        run: python scripts/atualizar.py

      - name: Salvar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualização automática $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
