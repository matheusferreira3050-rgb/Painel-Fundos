name: Atualizar cotas e publicar site

on:
  schedule:
    # horários em UTC (Brasília = UTC-3); o GitHub pode atrasar algumas horas
    - cron: "17 11 * * *"
    - cron: "47 22 * * *"
  push:
    branches: [main]
    paths:
      - "fundos.yaml"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A base histórica (cotas, CDI, cadastro) fica no branch "dados", sobrescrito a cada
      # rodada. Assim o repositório não cresce a cada atualização.
      - name: Recuperar base histórica
        run: |
          if git ls-remote --exit-code --heads origin dados >/dev/null; then
            git fetch --depth 1 origin dados
            rm -rf data && mkdir data
            git archive FETCH_HEAD | tar -x -C data
            echo "Base recuperada do branch dados"
          else
            echo "Primeira rodada com o branch dados: usando a pasta data do main"
          fi

      - name: Baixar dados da CVM e do Banco Central
        run: python scripts/atualizar.py

      - name: Guardar base histórica
        run: |
          cd data
          rm -rf .git
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Base $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
